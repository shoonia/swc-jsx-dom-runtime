[package]
name = "swc-jsx-dom-runtime"
version = "0.1.0"
edition = "2021"
authors = ["Alexander Zaytsev <zaytsev126@gmail.com>"]
description = "An SWC plugin that compiles JSX into optimized jsx-dom-runtime calls for direct DOM rendering"
license = "MIT"
repository = "https://github.com/shoonia/swc-jsx-dom-runtime"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
swc_core = { version = "77.0.*", features = [
  "ecma_ast",
  "ecma_visit",
  "ecma_utils",
  "ecma_plugin_transform",
] }

[dev-dependencies]
testing = "27.0.0"
swc_core = { version = "77.0.*", features = [
  "ecma_parser",
  "testing_transform",
] }
