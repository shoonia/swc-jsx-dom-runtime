[package]
name = "swc-jsx-dom-runtime"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[target.wasm32-wasip1]
rustflags = ["--cfg=swc_ast_unknown"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
serde = "1"
swc_core = { version = "77.0.*", features = [
  "ecma_ast",
  "ecma_visit",
  "ecma_utils",
  "ecma_plugin_transform",
] }

[dev-dependencies]
testing = "27.0.0"
swc_core = { version = "77.0.*", features = [
  "ecma_parser",
  "testing_transform",
] }
